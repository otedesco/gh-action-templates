name: Lint And Test

on:
  workflow_call:
    inputs:
      registry-auth-required:
        description: Whether this repository installs private packages
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

jobs:
  lint-and-test:
    name: Test on the supported runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup environment
        uses: otedesco/gh-action-templates/.github/actions/setup-environment@main
        with:
          registry-auth-required: ${{ inputs.registry-auth-required }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline

      - run: pnpm type:check

      - run: pnpm lint:check
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - run: pnpm test

      - uses: otedesco/gh-action-templates/.github/actions/notify-status@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
