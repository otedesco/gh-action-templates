name: Lint And Test

on:
  workflow_call:
    inputs:
      package-manager:
        description: Package manager selected by the repository runtime contract
        required: false
        type: string
        default: pnpm
      registry-auth-required:
        description: Whether this repository installs private packages
        required: false
        type: boolean
        default: false
    secrets:
      NPM_TOKEN:
        required: false

jobs:
  lint-and-test:
    name: Test on the supported runtime
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup environment
        uses: otedesco/gh-action-templates/.github/actions/setup-environment@main
        with:
          registry-auth-required: ${{ inputs.registry-auth-required }}
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: Install dependencies with pnpm
        if: ${{ inputs.package-manager == 'pnpm' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          pnpm install --frozen-lockfile --prefer-offline

      - name: Install dependencies with npm
        if: ${{ inputs.package-manager == 'npm' }}
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm ci --prefer-offline

      - name: Format check
        run: ${{ inputs.package-manager }} run format:check

      - name: Lint
        run: ${{ inputs.package-manager }} run lint:check
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"

      - name: Type check
        run: ${{ inputs.package-manager }} run type:check

      - name: Unit tests
        run: ${{ inputs.package-manager }} run test

      - name: Coverage
        run: ${{ inputs.package-manager }} run test:coverage

      - name: Evaluate changed-code coverage
        uses: otedesco/gh-action-templates/.github/actions/coverage-gate@main
        with:
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.sha }}

      - name: Build
        run: ${{ inputs.package-manager }} run build

      - name: Check for generated-file drift
        run: git diff --exit-code

      - name: Upload coverage decision
        if: ${{ always() }}
        uses: actions/upload-artifact@v3
        with:
          name: coverage-decision
          path: |
            coverage/
            coverage-baselines/

      - uses: otedesco/gh-action-templates/.github/actions/notify-status@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
