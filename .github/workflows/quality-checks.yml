name: Quality checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run central quality checks
        run: pnpm quality:check

      - name: Validate repository ruleset contract
        run: pnpm test:repository-rulesets

      - name: Validate CODEOWNERS contract
        run: pnpm test:codeowners

      - name: Validate required-check contract
        run: pnpm test:required-checks

      - name: Validate rendered ruleset payload
        run: pnpm test:ruleset-payload

  quality-gate:
    name: Quality / core
    if: ${{ always() }}
    needs: [quality-workflow]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require quality workflow
        env:
          QUALITY_RESULT: ${{ needs.quality-workflow.result }}
        run: test "$QUALITY_RESULT" = success
