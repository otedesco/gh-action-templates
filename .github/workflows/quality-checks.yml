name: Quality checks

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - main

permissions:
  contents: read

jobs:
  quality-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup environment
        uses: ./.github/actions/setup-environment

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run central quality checks
        run: >-
          pnpm format:check &&
          pnpm lint:check &&
          pnpm test:quality-tools-contract &&
          pnpm test:workflow-contract &&
          pnpm test:workflow-fixtures &&
          pnpm test:coverage-gate

      - name: Validate repository ruleset contract
        run: pnpm test:repository-rulesets

      - name: Validate CODEOWNERS contract
        run: pnpm test:codeowners

      - name: Validate required-check contract
        run: pnpm test:required-checks

      - name: Validate rendered ruleset payload
        run: pnpm test:ruleset-payload

  quality-gate:
    name: Quality / core
    if: ${{ always() }}
    needs: [quality-workflow]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require quality workflow
        env:
          QUALITY_RESULT: ${{ needs.quality-workflow.result }}
        run: test "$QUALITY_RESULT" = success
