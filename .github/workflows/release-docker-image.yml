name: Build & Release NodeJs Docker Image

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: true
      GH_TOKEN:
        required: true

jobs:
  release:
    name: Release Docker Image
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    strategy:
      matrix:
        include:
          - image: ghcr.io/${{ github.repository }}
            dockerfile: ./Dockerfile
          - image: ghcr.io/${{ github.repository }}
            dockerfile: ./Dockerfile.worker
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup environment and validate private registry credentials
        uses: otedesco/gh-action-templates/.github/actions/setup-environment@main
        with:
          registry-auth-required: "true"
          npm-token: ${{ secrets.NPM_TOKEN }}

      - name: check if dockerfile exists
        if: ${{ hashFiles(matrix.dockerfile) != '' }}
        run: echo "File exists"

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN }}

      - name: Build and push Docker image
        if: ${{ hashFiles(matrix.dockerfile) != '' }}
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          secrets: |
            npm_token=${{ secrets.NPM_TOKEN }}
