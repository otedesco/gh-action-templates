name: "Setup"
description: "Setup node.js environment"
inputs:
  node-version:
    description: Node version to be installed
    required: false
    default: "24.20.0"
  npm-version:
    description: NPM version to be installed
    required: false
    default: "10.8.2"
  pnpm-version:
    description: PNPM version to be installed
    required: false
    default: "10.34.0"
  npm-token:
    description: GitHub Packages token used only when registry-auth-required is true
    required: false
  registry-auth-required:
    description: Fail before install when private registry credentials are absent
    required: false
    default: "false"
runs:
  using: "composite"
  steps:
    - name: Set node/npm versions using volta
      uses: volta-cli/action@v4
      with:
        node-version: "24.20.0"
        npm-version: "10.8.2"

    - name: Install PNPM
      uses: pnpm/action-setup@v4
      with:
        version: "10.34.0"

    - id: versions
      name: Print node/npm/pnpm versions
      shell: bash
      run: |
        node_ver=$( node --version )
        pnpm_ver=$( pnpm --version )
        echo "Node: ${node_ver:1}"
        echo "NPM: $(npm --version)"
        if [[ $pnpm_ver != '' ]]; then echo "PNPM: $pnpm_ver"; fi
        echo "node_version=${node_ver:1}" >> "$GITHUB_OUTPUT"

    - name: Use the node_modules cache if available [pnpm]
      uses: actions/cache@v4
      with:
          key: ${{ runner.os }}-pnpm-${{ github.sha }}
          restore-keys: |
                ${{ runner.os }}-pnpm-
          path: ~/.local/share/pnpm

    - name: Validate private registry credentials
      if: ${{ inputs.registry-auth-required == 'true' }}
      shell: bash
      env:
        INPUT_NPM_TOKEN: ${{ inputs.npm-token }}
      run: node "$GITHUB_ACTION_PATH/registry-auth-cli.mjs"
